# Le bot a pris la place de l'ancien site : même Worker, relié au dépôt GitHub atlas-auto
name = "vapid-auto"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Garde les valeurs ajoutées dans le tableau de bord Cloudflare à chaque mise en ligne depuis GitHub
# (sans ça, celles de type « Texte » sont effacées : c'est arrivé le 2026-10-24)
keep_vars = true

# Dimanche, heure de Paris : 23 h mise à jour, 23 h 58 revérification, 23 h 59 clôture.
# Le cron tourne à 21 h et 22 h UTC (minutes 0, 58 et 59), le code garde le bon créneau.
[triggers]
crons = ["0,58,59 21,22 * * *"]

# Pas de [vars] ici : le dépôt GitHub est public. SHEET_ID (l'identifiant du tableau), DISCORD_TOKEN,
# DISCORD_PUBLIC_KEY et GOOGLE_JSON sont des secrets, dans Cloudflare → vapid-auto → Paramètres → Variables et secrets.
